[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "labloop"
version = "0.1.0"
description = "A small evidence-linked actor–critic–distiller research loop"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "rdflib>=7,<8", "PyYAML>=6,<7"]

[project.optional-dependencies]
genomics = ["whatshap>=2.8", "pysam>=0.23"]
test = ["pytest>=8"]

[project.scripts]
labloop = "labloop.cli:main"

[tool.setuptools.packages.find]
include = ["labloop*"]

[tool.setuptools.package-data]
labloop = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
