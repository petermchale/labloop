<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc">
<title id="title">LabLoop learning architecture</title>
<desc id="desc">The scientist provides a goal to the actor, evaluation criteria to the critic, and learning guidance to the distiller. Actor, critic, and distiller repeat for N cycles. The distiller hands proposed lessons to the next actor. All roles share a knowledge base, which also receives scientist outcome feedback.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
 <style>
 text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#172554; text-anchor:middle; }
 .title {font-size:23px;font-weight:650} .label {font-size:16px} .small {font-size:14px;fill:#475569}
 .edge {fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
 .memory {fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:6 5;marker-start:url(#arrow);marker-end:url(#arrow)}
 .box {stroke:#94a3b8;stroke-width:1.5;rx:14}
 </style>
</defs>
<rect width="1080" height="640" rx="18" fill="#f8fafc"/>
<rect class="box" x="400" y="25" width="240" height="66" fill="#ffffff"/>
<text class="title" x="520" y="66">Scientist</text>
<!-- Scientist instructions: separate inputs for each role. -->
<path class="edge" d="M440 91L150 205"/>
<path class="edge" d="M520 91V205"/>
<path class="edge" d="M600 91L890 205"/>
<text class="label" x="275" y="136">Goal</text>
<text class="label" x="587" y="159">Criteria</text>
<rect x="686" y="113" width="170" height="29" fill="#f8fafc"/>
<text class="label" x="771" y="136">Learning guidance</text>
<!-- Main learning cycle. -->
<rect class="box" x="55" y="205" width="190" height="86" fill="#dbeafe"/>
<rect class="box" x="425" y="205" width="190" height="86" fill="#e0e7ff"/>
<rect class="box" x="795" y="205" width="190" height="86" fill="#ede9fe"/>
<text class="title" x="150" y="242">Actor</text><text class="small" x="150" y="268">Performs research</text>
<text class="title" x="520" y="242">Critic</text><text class="small" x="520" y="268">Evaluates evidence</text>
<text class="title" x="890" y="242">Distiller</text><text class="small" x="890" y="268">Proposes lessons</text>
<path class="edge" d="M245 247H425"/>
<text class="label" x="335" y="217">Work products</text><text class="small" x="335" y="237">and evidence</text>
<path class="edge" d="M615 247H795"/>
<text class="label" x="705" y="217">Observations</text><text class="small" x="705" y="237">and diagnoses</text>
<path class="edge" d="M860 291V351H180V291"/>
<rect x="327" y="337" width="386" height="28" fill="#f8fafc"/>
<text class="label" x="520" y="357">Proposed lessons → next actor invocation</text>
<text class="small" x="520" y="398">Repeat actor → critic → distiller for N cycles</text>
<!-- Shared memory; dashed edges are separate from execution order. -->
<rect class="box" x="360" y="470" width="320" height="82" fill="#f1f5f9"/>
<text class="title" x="520" y="506">Knowledge base</text>
<text class="small" x="520" y="533">Evidence, hypotheses, lessons, provenance</text>
<path class="memory" d="M115 291V511H360"/>
<path class="memory" d="M520 291V470"/>
<path class="memory" d="M925 291V511H680"/>
<rect x="425" y="424" width="190" height="23" fill="#f8fafc"/>
<text class="small" x="520" y="441">Retrieve and record</text>
<path class="edge" d="M640 58H1035V596H520V552"/>
<text class="small" x="790" y="584">Scientist outcome feedback</text>
</svg>
